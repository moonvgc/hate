<script>
(function() {
    var container = document.getElementById('archives3d');
    if (!container || typeof THREE === 'undefined' || !THREE.TTFLoader || typeof BILBO_TTF_B64 === 'undefined') return;
    var renderer;
    try { renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true }); }
    catch (e) { return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 3000);
    var group = new THREE.Group();
    scene.add(group);

    var ambient = new THREE.AmbientLight(0xffffff, 0.55); scene.add(ambient);
    var key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(200, 300, 420); scene.add(key);
    var rim = new THREE.DirectionalLight(0x7a8cff, 0.9); rim.position.set(-320, -220, 120); scene.add(rim);
    var material = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.25, emissive: 0x1c1c30, emissiveIntensity: 0.7 });

    var mesh = null;
    try {
        var bin = atob(BILBO_TTF_B64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var font = new THREE.Font(new THREE.TTFLoader().parse(bytes.buffer));
        var geo = new THREE.TextGeometry('archives', { font: font, size: 60, height: 16, curveSegments: 12, bevelEnabled: true, bevelThickness: 2, bevelSize: 1.5, bevelOffset: 0, bevelSegments: 3 });
        geo.computeBoundingBox();
        var bb = geo.boundingBox;
        var cx = (bb.max.x + bb.min.x) / 2, cy = (bb.max.y + bb.min.y) / 2, cz = (bb.max.z + bb.min.z) / 2;
        mesh = new THREE.Mesh(geo, material);
        mesh.position.set(-cx, -cy, -cz);
        group.add(mesh);
    } catch (e) { console.error('3D archives failed', e); return; }

    function fit() {
        var w = container.clientWidth || window.innerWidth;
        var h = container.clientHeight || window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        var z = Math.min(window.innerWidth, window.innerHeight) * 0.9;
        camera.position.z = z;
        if (mesh) {
            var bb = mesh.geometry.boundingBox;
            var targetPx = Math.min(window.innerWidth * 0.32, window.innerHeight * 0.42);
            var visibleH = 2 * z * Math.tan(22.5 * Math.PI / 180);
            var pxPerUnit = h / visibleH;
            var scale = (targetPx / pxPerUnit) / (bb.max.x - bb.min.x);
            group.scale.setScalar(scale);
        }
    }
    fit();
    window.addEventListener('resize', fit);

    var raf = 0, start = performance.now();
    function loop(now) {
        raf = requestAnimationFrame(loop);
        var t = (now - start) / 1000;
        group.rotation.x = -0.12 + Math.sin(t * 0.22) * 0.02;
        group.rotation.y = Math.sin(t * 0.18) * 0.08;
        group.rotation.z = Math.sin(t * 0.26) * 0.025;
        group.position.y = Math.sin(t * 0.55) * 7;
        group.position.z = 0;
        renderer.render(scene, camera);
    }
    loop(start);

    if (typeof gsap !== 'undefined') {
        gsap.to(container, { opacity: 1, duration: 1.1, ease: 'power2.out', delay: 0.45 });
    } else {
        container.style.opacity = '1';
    }

    window.addEventListener('beforeunload', function () {
        cancelAnimationFrame(raf);
        renderer.dispose();
    });
})();
</script>
