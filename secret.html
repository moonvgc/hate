        <style>
            @font-face {
                font-family: "Bilbo";
                src: url("fonts/bilboregular.ttf") format("truetype");
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: "SunandMoon";
                src: url("fonts/SunandMoon.ttf") format("truetype");
                font-weight: normal;
                font-style: normal;
            }

            .warning-toggle,
            .warning-banner,
            #settingsAlert,
            #settingsSet,
            #latestEntry,
            .statusWrapper,
            #openAbout,
            .aboutMe,
            .ageRating,
            .playerOpacity,
            #loading2,
            .overlayre3,
            .overlayre1,
            .overlayre2,
            .overlayScreen1,
            .overlayScreen2,
            .window1,
            #navigationClose,
            #button4,
            #navigation,
            #navigationTwo,
            .moonObject {
                display: none !important;
            }

            html,
            body {
                overflow: hidden !important;
                height: 100%;
            }

            .ba-stage {
                position: fixed;
                inset: 0;
                z-index: 1;
                overflow: hidden;
                background: #000;
            }
            .ba-video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center;
                background: #000;
                display: block;
                filter: grayscale(1) contrast(1.28) brightness(1.02);
                transition: filter 0.8s ease;
            }
            .ba-stage.playing .ba-video {
                filter: grayscale(1) contrast(1.36) brightness(1.06);
            }
            .ba-dither {
                position: absolute;
                inset: -2px;
                z-index: 3;
                pointer-events: none;
                background-image: url("images/bayer.png");
                background-repeat: repeat;
                background-size: 4px 4px;
                mix-blend-mode: overlay;
                opacity: 0.55;
            }
            .ba-scan {
                position: absolute;
                inset: 0;
                z-index: 4;
                pointer-events: none;
                background: repeating-linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.28) 0px,
                    rgba(0, 0, 0, 0.28) 1px,
                    rgba(0, 0, 0, 0) 1px,
                    rgba(0, 0, 0, 0) 3px
                );
                opacity: 0.35;
            }
            .ba-vignette {
                position: absolute;
                inset: 0;
                z-index: 5;
                pointer-events: none;
                background: radial-gradient(ellipse at center, transparent 48%, rgba(0, 0, 0, 0.62) 100%);
            }
            .ba-roll {
                position: absolute;
                left: 0;
                right: 0;
                height: 22%;
                z-index: 4;
                pointer-events: none;
                background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.05), transparent);
                mix-blend-mode: screen;
                animation: baRoll 7s linear infinite;
            }
            @keyframes baRoll {
                0% {
                    top: -30%;
                }
                100% {
                    top: 110%;
                }
            }

            .ba-back {
                position: fixed;
                top: 20px;
                left: 20px;
                z-index: 7500;
                background: rgba(0, 0, 0, 0.9);
                border: 1px dotted rgba(255, 255, 255, 0.3);
                color: #fff;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 10pt;
                font-style: italic;
                letter-spacing: 1px;
                text-decoration: none;
                cursor: pointer;
                padding: 4px 10px;
                outline: none;
                opacity: 0;
                visibility: hidden;
                transform: translateX(-10px);
                transition: background 0.3s ease, color 0.3s ease, border 0.3s ease, opacity 0.5s ease,
                    transform 0.5s ease, visibility 0.5s;
            }
            .ba-back.show {
                opacity: 1;
                visibility: visible;
                transform: translateX(0);
            }
            .ba-back:hover {
                background: rgba(255, 255, 255, 0.95);
                color: #000;
                border: 1px solid #fff;
            }

            .ba-controls {
                position: fixed;
                right: 20px;
                bottom: 20px;
                z-index: 600;
                display: flex;
                gap: 8px;
                opacity: 0;
                visibility: hidden;
                transform: translateY(12px);
                transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
            }
            .ba-controls.show {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }
            .ba-ctrl {
                background: rgba(0, 0, 0, 0.9);
                border: 1px dotted rgba(255, 255, 255, 0.3);
                color: #fff;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 9.5pt;
                font-style: italic;
                letter-spacing: 0.5px;
                cursor: pointer;
                padding: 4px 12px;
                outline: none;
                transition: all 0.3s ease;
            }
            .ba-ctrl:hover {
                background: rgba(255, 255, 255, 0.95);
                color: #000;
                border: 1px solid #fff;
            }

            .matrix {
                opacity: 0.34 !important;
            }
            .matrix2 {
                opacity: 0.05 !important;
            }
            .matrix3 {
                opacity: 0.4 !important;
                mix-blend-mode: overlay !important;
            }
            .contrastadjust {
                display: none !important;
            }

            @media (max-width: 900px) {
                .ba-ctrl {
                    font-size: 8.5pt;
                    padding: 4px 9px;
                }
                .ba-controls {
                    right: 12px;
                    bottom: 14px;
                }
            }
        </style>

    <body oncontextmenu="return false;">
        <div class="invertColors"></div>
        <div class="blackFade"></div>
        <img class="rainClouds" src="images/bg.jpg" draggable="false" style="opacity: 1; visibility: inherit" />

        <div class="ba-stage" id="baStage">
            <video
                class="ba-video"
                id="baVideo"
                src="media/badapple.mp4"
                preload="auto"
                playsinline
                webkit-playsinline
            ></video>
            <div class="ba-dither"></div>
            <div class="ba-scan"></div>
            <div class="ba-roll"></div>
            <div class="ba-vignette"></div>
        </div>

        <a href="index.html" class="ba-back" id="baBack">&larr; return</a>

        <div class="ba-controls" id="baControls">
            <button class="ba-ctrl" id="baToggle">pause</button>
        </div>

        <div class="page-transition-overlay" id="pageTransitionOverlay"></div>
        <div class="site-sign">hate.移动</div>
        <div class="flicker"></div>
        <div class="saturate"></div>
        <div class="coloradjust"></div>
        <div class="matrix"></div>
        <div class="matrix2"></div>
        <div class="matrix3"></div>
        <div class="matrix4"></div>
        <div class="matrix5"></div>

        <script>
            (function () {
                var video = document.getElementById("baVideo");
                var stage = document.getElementById("baStage");
                var controls = document.getElementById("baControls");
                var backBtn = document.getElementById("baBack");
                var toggleBtn = document.getElementById("baToggle");
                var overlay = document.getElementById("pageTransitionOverlay");
                if (!video || !stage) return;

                video.volume = 0.85;
                video.loop = true;

                function isFullscreen() {
                    return !!(document.fullscreenElement || document.webkitFullscreenElement);
                }

                function requestFS() {
                    if (isFullscreen()) return;
                    var el = document.documentElement;
                    if (el.requestFullscreen) {
                        el.requestFullscreen().catch(function () {});
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen();
                    } else if (video.webkitEnterFullscreen) {
                        video.webkitEnterFullscreen();
                    }
                }

                function exitFS() {
                    if (document.exitFullscreen && document.fullscreenElement) {
                        document.exitFullscreen().catch(function () {});
                    } else if (document.webkitExitFullscreen && document.webkitFullscreenElement) {
                        document.webkitExitFullscreen();
                    }
                }

                function showChrome() {
                    if (controls) controls.classList.add("show");
                    if (backBtn) backBtn.classList.add("show");
                }

                function tryPlay() {
                    var p = video.play();
                    if (p && p.catch) p.catch(function () {});
                }

                showChrome();
                if (toggleBtn && video.paused) toggleBtn.textContent = "play";
                tryPlay();
                window.addEventListener("load", tryPlay);

                video.addEventListener("play", function () {
                    stage.classList.add("playing");
                    showChrome();
                    if (toggleBtn) toggleBtn.textContent = "pause";
                });
                video.addEventListener("pause", function () {
                    stage.classList.remove("playing");
                    if (toggleBtn) toggleBtn.textContent = "play";
                });

                if (toggleBtn) {
                    toggleBtn.addEventListener("click", function () {
                        if (video.paused) {
                            video.play().catch(function () {});
                        } else {
                            video.pause();
                        }
                    });
                }

                requestFS();

                var armed = true;
                function tryEnterFullscreen(e) {
                    if (!armed) return;
                    var t = e && e.target;
                    if (t && t.closest && t.closest(".ba-back, .ba-controls")) return;
                    armed = false;
                    if (!isFullscreen()) requestFS();
                    tryPlay();
                }
                ["pointerdown", "pointerup", "mousedown", "touchstart", "touchend", "keydown", "click"].forEach(
                    function (ev) {
                        document.addEventListener(ev, tryEnterFullscreen, true);
                    }
                );

                document.addEventListener("keydown", function (e) {
                    var k = (e.key || "").toLowerCase();
                    if (k === "escape") {
                    } else if (k === " ") {
                        e.preventDefault();
                        if (video.paused) video.play().catch(function () {});
                        else video.pause();
                    } else if (k === "f") {
                        if (isFullscreen()) exitFS();
                        else requestFS();
                    }
                });

                if (backBtn) backBtn.classList.add("show");
                if (overlay && typeof gsap !== "undefined") {
                    gsap.fromTo(overlay, { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.out" });
                    overlay.style.pointerEvents = "none";
                } else if (overlay) {
                    overlay.style.opacity = "0";
                    overlay.style.pointerEvents = "none";
                }
                window.addEventListener("pageshow", function (event) {
                    if (event.persisted && overlay) {
                        overlay.style.opacity = "0";
                        overlay.style.pointerEvents = "none";
                    }
                });

                if (backBtn) {
                    backBtn.addEventListener("click", function (e) {
                        e.preventDefault();
                        try {
                            video.pause();
                        } catch (err) {}
                        var target = this.getAttribute("href") || "index.html";
                        if (overlay && typeof gsap !== "undefined") {
                            overlay.style.pointerEvents = "auto";
                            gsap.to(overlay, {
                                opacity: 1,
                                duration: 0.45,
                                ease: "power2.inOut",
                                onComplete: function () {
                                    window.location.href = target;
                                },
                            });
                        } else {
                            window.location.href = target;
                        }
                    });
                }
            })();
        </script>

        <script>
            (function () {
                var fullText = "B A D  A P P L E";
                var currentText = "B";
                var index = 1;
                var isTyping = true;
                function animateTitle() {
                    if (isTyping) {
                        currentText += fullText.charAt(index);
                        index++;
                        document.title = currentText;
                        if (index >= fullText.length) {
                            isTyping = false;
                            setTimeout(animateTitle, 2000);
                            return;
                        }
                        setTimeout(animateTitle, 300);
                    } else {
                        currentText = "B";
                        index = 1;
                        isTyping = true;
                        document.title = currentText;
                        setTimeout(animateTitle, 300);
                    }
                }
                setTimeout(animateTitle, 300);
            })();
        </script>
