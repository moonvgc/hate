    pageTitle.style.opacity='1';
    gsap.to(pageTitle,{opacity:1,duration:1.5,ease:'power2.out'});

<script>
(function(){
    var container=document.getElementById('splash3d');
    function fallback(){if(container)container.innerHTML='<span class="splash-text">hate</span>';}
    if(!container||typeof THREE==='undefined'||!THREE.TTFLoader||typeof BILBO_TTF_B64==='undefined'){fallback();return;}
    var renderer;
    try{renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});}
    catch(e){fallback();return;}
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    container.appendChild(renderer.domElement);
    var scene=new THREE.Scene();
    var camera=new THREE.PerspectiveCamera(45,1,0.1,3000);
    var group=new THREE.Group();
    scene.add(group);
    var ambient=new THREE.AmbientLight(0xffffff,0.55);scene.add(ambient);
    var key=new THREE.DirectionalLight(0xffffff,1.3);key.position.set(200,300,420);scene.add(key);
    var rim=new THREE.DirectionalLight(0x7a8cff,0.9);rim.position.set(-320,-220,120);scene.add(rim);
    var material=new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.9,roughness:0.25,emissive:0x1c1c30,emissiveIntensity:0.7});
    try{
        var bin=atob(BILBO_TTF_B64);
        var bytes=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
        var font=new THREE.Font(new THREE.TTFLoader().parse(bytes.buffer));
        var geo=new THREE.TextGeometry('hate',{font:font,size:90,height:24,curveSegments:14,bevelEnabled:true,bevelThickness:6,bevelSize:3,bevelOffset:0,bevelSegments:6});
        geo.computeBoundingBox();
        var bb=geo.boundingBox;
        var cx=(bb.max.x+bb.min.x)/2,cy=(bb.max.y+bb.min.y)/2,cz=(bb.max.z+bb.min.z)/2;
        var mesh=new THREE.Mesh(geo,material);
        mesh.position.set(-cx,-cy,-cz);
        group.add(mesh);
    }catch(e){console.error('3D text failed',e);fallback();renderer.dispose();return;}
    function fit(){
        var w=container.clientWidth||window.innerWidth,h=container.clientHeight||window.innerHeight;
        camera.aspect=w/h;camera.updateProjectionMatrix();
        renderer.setSize(w,h);
        camera.position.z=Math.min(w,h)*0.9;
    }
    fit();
    window.addEventListener('resize',fit);
    var raf=0,start=performance.now(),running=true;
    function loop(now){
        if(!running)return;
        raf=requestAnimationFrame(loop);
        var t=(now-start)/1000;
        group.rotation.x=-0.14+Math.sin(t*0.3)*0.03;
        group.rotation.y=Math.sin(t*0.24)*0.1;
        group.rotation.z=Math.sin(t*0.35)*0.035;
        group.position.y=Math.sin(t*0.9)*8;
        renderer.render(scene,camera);
    }
    loop(start);
    window.stopSplash3D=function(){
        running=false;
        cancelAnimationFrame(raf);
        window.removeEventListener('resize',fit);
        renderer.dispose();
    };
})();
</script>

<script>
(function() {
    var fullText = "H A T E . 移动";
    var currentText = "H";
    var index = 1;
    var isTyping = true;

    function animateTitle() {
        if (isTyping) {
            currentText += fullText.charAt(index);
            index++;
            document.title = currentText;

            if (index >= fullText.length) {
                isTyping = false;
                setTimeout(animateTitle, 2000);
                return;
            }
            setTimeout(animateTitle, 300);
        } else {
            currentText = "H";
            index = 1;
            isTyping = true;
            document.title = currentText;
            setTimeout(animateTitle, 300);
        }
    }
    
    setTimeout(animateTitle, 300);
})();
</script>
