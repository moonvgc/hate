            .card-face {

                width: 100%;
                height: 100%;

                background: rgba(20, 20, 25, 0.8);
                border: 1px solid rgba(255, 255, 255, 0.4);

                    border-color 0.3s ease,
                    box-shadow 0.3s ease,

                inset: 0;

            .audio-equalizer .bar-1 { height: 10px; }

            .audio-equalizer.playing .bar-1 {
                animation: eqDance1 0.75s ease-in-out infinite alternate;
            }
            .audio-equalizer.playing .bar-2 {

            }
            .audio-equalizer.playing .bar-4 {

            }
            .audio-equalizer.playing .bar-5 {
                animation: eqDance5 0.8s ease-in-out infinite alternate 0.05s;
            }

            @keyframes eqDance1 { 0% { height: 3px; } 100% { height: 15px; } }
            @keyframes eqDance2 { 0% { height: 13px; } 100% { height: 3px; } }
            @keyframes eqDance3 { 0% { height: 4px; } 100% { height: 16px; } }
            @keyframes eqDance4 { 0% { height: 14px; } 100% { height: 5px; } }
            @keyframes eqDance5 { 0% { height: 4px; } 100% { height: 12px; } }

            (function () {

                function fallback() {
                    if (container) {
                        container.style.display = "flex";
                        container.style.alignItems = "center";
                        container.style.justifyContent = "center";
                        container.innerHTML = '<span class="splash-text">hate</span>';

                    !THREE.TTFLoader ||
                    typeof BILBO_TTF_B64 === "undefined"
                ) {
                    fallback();
                    return;
                }
                var renderer;
                try {
                    renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                } catch (e) {
                    fallback();
                    return;
                }
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);
                var scene = new THREE.Scene();
                var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 3000);
                var group = new THREE.Group();
                scene.add(group);
                var ambient = new THREE.AmbientLight(0xffffff, 0.55);
                scene.add(ambient);
                var key = new THREE.DirectionalLight(0xffffff, 1.3);
                key.position.set(200, 300, 420);
                scene.add(key);
                var rim = new THREE.DirectionalLight(0x7a8cff, 0.9);
                rim.position.set(-320, -220, 120);
                scene.add(rim);
                var material = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    metalness: 0.9,
                    roughness: 0.25,
                    emissive: 0x1c1c30,
                    emissiveIntensity: 0.7,
                });
                try {
                    var bin = atob(BILBO_TTF_B64);
                    var bytes = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    var font = new THREE.Font(new THREE.TTFLoader().parse(bytes.buffer));
                    var geo = new THREE.TextGeometry("hate", {
                        font: font,
                        size: 90,
                        height: 24,
                        curveSegments: 14,
                        bevelEnabled: true,
                        bevelThickness: 6,
                        bevelSize: 3,
                        bevelOffset: 0,
                        bevelSegments: 6,
                    });
                    geo.computeBoundingBox();
                    var bb = geo.boundingBox;
                    var cx = (bb.max.x + bb.min.x) / 2,
                        cy = (bb.max.y + bb.min.y) / 2,
                        cz = (bb.max.z + bb.min.z) / 2;
                    var mesh = new THREE.Mesh(geo, material);
                    mesh.position.set(-cx, -cy, -cz);
                    group.add(mesh);
                } catch (e) {
                    console.error("3D text failed", e);
                    fallback();
                    renderer.dispose();
                    return;
                }
                function fit() {
                    var w = container.clientWidth || window.innerWidth,
                        h = container.clientHeight || window.innerHeight;
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                    camera.position.z = Math.min(w, h) * 0.9;
                }
                fit();
                window.addEventListener("resize", fit);
                var raf = 0,
                    start = performance.now(),
                    running = true;
                function loop(now) {
                    if (!running) return;
                    raf = requestAnimationFrame(loop);
                    var t = (now - start) / 1000;
                    group.rotation.x = -0.14 + Math.sin(t * 0.3) * 0.03;

                    group.rotation.z = Math.sin(t * 0.35) * 0.035;
                    group.position.y = Math.sin(t * 0.9) * 8;
                    renderer.render(scene, camera);
                }
                loop(start);
                window.stopSplash3D = function () {
                    running = false;
                    cancelAnimationFrame(raf);
                    window.removeEventListener("resize", fit);
                    renderer.dispose();
                };

        <script>
            (function () {
                const container = document.getElementById("vortexContainer");
                if (!container) return;
                const cards = container.querySelectorAll(".vortex-card");
                const totalCards = cards.length;
                let currentAngle = 0,
                    targetAngle = 0,
                    isDragging = false,
                    hasDragged = false,
                    startX = 0,
                    startAngle = 0,
                    hoveredCard = null,
                    autoRotateSpeed = 0,
                    velocity = 0,
                    hasInteracted = false,
                    introBlend = 0;
                const config = {
                    radius: 200,
                    cardSpacing: (Math.PI * 2) / totalCards,
                    tilt: -8,
                    dragSensitivity: 0.005,
                    friction: 0.95,
                    introGap: 210,
                    introSlant: 6,
                };
                if (window.innerWidth < 600) {
                    config.radius = 120;
                    config.introGap = 140;
                } else if (window.innerWidth < 900) {
                    config.radius = 160;
                    config.introGap = 170;
                }
                cards.forEach((card, i) => {
                    card.dataset.index = i;
                    card.dataset.baseAngle = (i * config.cardSpacing).toString();
                    card.addEventListener("click", (e) => {
                        if (hasDragged) {
                            e.preventDefault();
                            return;
                        }
                        if (!hasInteracted) {
                            hasInteracted = true;
                            autoRotateSpeed = 0.0003;
                        }
                        const baseAngle = parseFloat(card.dataset.baseAngle);
                        const angle = baseAngle + currentAngle;
                        const z = Math.cos(angle) * config.radius;
                        const depthRatio = (z + config.radius) / (config.radius * 2);
                        if (depthRatio <= 0.5) {
                            const cardIndex = parseInt(card.dataset.index);
                            const currentRot = ((currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                            const targetRot = Math.PI * 2 - cardIndex * config.cardSpacing;
                            targetAngle += targetRot - currentRot;
                            return;
                        }
                        const profile = card.getAttribute("data-profile");
                        if (profile && typeof showProfile === "function") showProfile(profile);
                    });
                    card.addEventListener("mouseenter", () => {
                        hoveredCard = card;
                        autoRotateSpeed = 0;
                    });
                    card.addEventListener("mouseleave", () => {
                        hoveredCard = null;
                        if (hasInteracted) autoRotateSpeed = 0.0003;
                    });
                });
                container.addEventListener("mousedown", (e) => {
                    if (!hasInteracted) {
                        hasInteracted = true;
                        autoRotateSpeed = 0.0003;
                    }
                    isDragging = true;
                    hasDragged = false;
                    startX = e.clientX;
                    startAngle = targetAngle;
                    velocity = 0;
                    container.style.cursor = "grabbing";
                    autoRotateSpeed = 0;
                });
                document.addEventListener("mouseup", () => {
                    if (!isDragging) return;
                    isDragging = false;
                    container.style.cursor = "default";
                    targetAngle += velocity * 20;
                    if (hasInteracted) autoRotateSpeed = 0.0003;
                });
                document.addEventListener("mousemove", (e) => {
                    if (!isDragging) return;
                    const delta = e.clientX - startX;
                    if (Math.abs(delta) > 10) hasDragged = true;
                    const newAngle = startAngle + delta * config.dragSensitivity;
                    velocity = newAngle - targetAngle;
                    targetAngle = newAngle;
                });
                container.addEventListener(
                    "touchstart",
                    (e) => {
                        if (!hasInteracted) {
                            hasInteracted = true;
                            autoRotateSpeed = 0.0003;
                        }
                        isDragging = true;
                        hasDragged = false;
                        startX = e.touches[0].clientX;
                        startAngle = targetAngle;
                        velocity = 0;
                        autoRotateSpeed = 0;
                    },
                    { passive: true }
                );
                document.addEventListener("touchend", () => {
                    if (!isDragging) return;
                    isDragging = false;
                    targetAngle += velocity * 20;
                    if (hasInteracted) autoRotateSpeed = 0.0003;
                });
                document.addEventListener(
                    "touchmove",
                    (e) => {
                        if (!isDragging) return;
                        const delta = e.touches[0].clientX - startX;
                        if (Math.abs(delta) > 10) hasDragged = true;
                        const newAngle = startAngle + delta * config.dragSensitivity;
                        velocity = newAngle - targetAngle;
                        targetAngle = newAngle;
                    },
                    { passive: true }
                );
                document.addEventListener("keydown", (e) => {
                    if (e.key === "ArrowLeft") {
                        if (!hasInteracted) {
                            hasInteracted = true;
                            autoRotateSpeed = 0.0003;
                        }
                        e.preventDefault();
                        targetAngle -= 0.5;
                    } else if (e.key === "ArrowRight") {
                        if (!hasInteracted) {
                            hasInteracted = true;
                            autoRotateSpeed = 0.0003;
                        }
                        e.preventDefault();
                        targetAngle += 0.5;
                    }
                });
                let swayTime = 0;
                function animate() {
                    swayTime += 0.02;
                    if (hasInteracted && introBlend < 1) {
                        introBlend += 0.02;
                        if (introBlend > 1) introBlend = 1;
                    }
                    if (!isDragging && !hoveredCard) targetAngle += autoRotateSpeed;
                    if (!isDragging) {
                        velocity *= config.friction;
                        targetAngle += velocity;
                    }
                    currentAngle += (targetAngle - currentAngle) * 0.1;
                    cards.forEach((card, i) => {
                        const baseAngle = parseFloat(card.dataset.baseAngle);
                        const angle = baseAngle + currentAngle;
                        const swayOff = i * 0.8;
                        const swayY = Math.sin(swayTime + swayOff) * 8;
                        const swayRZ = Math.sin(swayTime * 0.5 + swayOff) * 1.5;
                        const introOffset = i - (totalCards - 1) / 2;
                        const introX = introOffset * config.introGap;
                        const introSlant = introOffset * config.introSlant;
                        const introZ = introOffset === 0 ? 40 : 0;
                        const orbX = Math.sin(angle) * config.radius;
                        const orbZ = Math.cos(angle) * config.radius;
                        const orbRotY = -angle * (180 / Math.PI);
                        const depthRatio = (orbZ + config.radius) / (config.radius * 2);
                        const isFront = depthRatio > 0.5;
                        const orbOpacity = isFront ? 1 : 0.35 + depthRatio * 0.3;
                        const orbScale = isFront ? 1 : 0.75 + depthRatio * 0.15;
                        const t = introBlend;
                        const x = introX * (1 - t) + orbX * t;
                        const z = introZ * (1 - t) + orbZ * t;
                        const rotY = introSlant * (1 - t) + orbRotY * t;
                        const opacity = 1 * (1 - t) + orbOpacity * t;
                        const scale = 1 * (1 - t) + orbScale * t;
                        card.style.zIndex = Math.floor(z + config.radius);
                        card.style.transform = `translateX(${x}px) translateY(${swayY}px) translateZ(${z}px) rotateY(${rotY}deg) rotateX(${config.tilt}deg) rotateZ(${swayRZ}deg)`;
                        card.style.opacity = opacity;
                        card.style.pointerEvents = "auto";
                        const face = card.querySelector(".card-face");
                        if (face) face.style.transform = `scale(${scale})`;
                    });
                    requestAnimationFrame(animate);
                }
                animate();
                document.addEventListener("visibilitychange", () => {
                    if (hasInteracted) autoRotateSpeed = document.hidden ? 0 : 0.0003;
                });
            })();

                const audio = currentProfileAudio[currentTrackIndex];
                audio.pause();
                audio.currentTime = 0;
                updatePlayLabel();
                updateProgressBar();
            }
            function togglePlay() {
                if (!currentProfileAudio || currentProfileAudio.length === 0) return;
                const audio = currentProfileAudio[currentTrackIndex];
                if (audio.paused) {
                    audio.play().catch(function () {});
                } else {
                    audio.pause();
                }
                updatePlayLabel();
            }
            allAudio.forEach(function (audio) {
                audio.addEventListener("play", updatePlayLabel);
                audio.addEventListener("pause", updatePlayLabel);
                audio.addEventListener("timeupdate", updateProgressBar);
            });
            applyVolume();

            if (audioProgressWrap) {
                audioProgressWrap.addEventListener("click", function (e) {
                    const audio =
                        currentProfileAudio && currentProfileAudio.length
                            ? currentProfileAudio[currentTrackIndex]
                            : null;
                    if (!audio || !audio.duration) return;
                    const rect = audioProgressWrap.getBoundingClientRect();
                    const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
                    audio.currentTime = (x / rect.width) * audio.duration;
                    updateProgressBar();
                });
            }
            if (audioEqualizer) {
                audioEqualizer.addEventListener("click", togglePlay);
            }
            if (audioMeta) {
                audioMeta.addEventListener("click", skipToNextTrack);
            }
            if (skipSongBtn) {
                skipSongBtn.addEventListener("click", skipToNextTrack);
            }

            function playProfileAudio(profile) {
                if (!userInteracted) return;
                stopProfileAudio();
                if (profile === "rupo") {
                    currentProfileAudio = [rupoAudio1, rupoAudio2, rupoAudio3];
                    currentTrackIndex = 0;
                    playCurrentTrack();
                } else if (profile === "Maxim") {
                    currentProfileAudio = [MaximAudio1, MaximAudio2, MaximAudio3, MaximAudio4, MaximAudio5];
                    currentTrackIndex = 0;
                    playCurrentTrack();
                }
            }
            function playCurrentTrack() {
                if (!currentProfileAudio || currentProfileAudio.length === 0) return;
                const audio = currentProfileAudio[currentTrackIndex];
                audio.volume = musicVolume;
                audio.currentTime = 0;
                audio.play().catch(function () {});
                audio.onended = function () {
                    currentTrackIndex++;
                    if (currentTrackIndex >= currentProfileAudio.length) {
                        currentTrackIndex = 0;
                    }
                    playCurrentTrack();
                };
                updateNowPlaying();
                updatePlayLabel();
                updateProgressBar();
            }
            function skipToNextTrack() {
                if (!currentProfileAudio || currentProfileAudio.length === 0) return;
                currentProfileAudio[currentTrackIndex].pause();
                currentProfileAudio[currentTrackIndex].currentTime = 0;
                currentTrackIndex++;
                if (currentTrackIndex >= currentProfileAudio.length) {
                    currentTrackIndex = 0;
                }
                playCurrentTrack();
            }
            function stopProfileAudio() {
                if (currentProfileAudio) {
                    currentProfileAudio.forEach(function (audio) {
                        audio.pause();
                        audio.currentTime = 0;
                        audio.onended = null;
                    });
                }
                currentProfileAudio = null;
                currentTrackIndex = 0;
                updatePlayLabel();
                updateProgressBar();
            }
            window.showProfile = function (who) {
                userInteracted = true;
                const profileEl = document.getElementById("profile-" + who);
                if (!profileEl) return;

                if (currentProfile && currentProfile !== who) {
                    const oldEl = document.getElementById("profile-" + currentProfile);
                    stopProfileAudio();
                    if (oldEl) {
                        gsap.to(oldEl, {
                            autoAlpha: 0,
                            duration: 0.35,
                            ease: "power2.inOut",
                            onComplete: function () {
                                oldEl.classList.remove("active");
                                currentProfile = who;
                                profileEl.classList.add("active");
                                gsap.fromTo(profileEl, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out" });
                                playProfileAudio(who);
                            }
                        });
                    }
history.pushState(null, "", "#" + who);
                return;
            }
            if (currentProfile === who) return;
            currentProfile = who;
            document.body.classList.add("profile-open");

                if (profileDimmer) {
                    profileDimmer.classList.add("active");
                    gsap.fromTo(profileDimmer, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.9, ease: "power2.out" });
                }
                if (profileBanner) {
                    profileBanner.classList.add("active");
                    gsap.fromTo(profileBanner,
                        { autoAlpha: 0, scale: 1.15, xPercent: -50, yPercent: -50 },
                        { autoAlpha: 1, scale: 1, xPercent: -50, yPercent: -50, duration: 1.4, ease: "power3.out" }
                    );
                }

                landingEls.forEach(function (el) {
                    if (el) {
                        gsap.to(el, {
                            autoAlpha: 0,
                            duration: 0.6,
                            ease: "power2.inOut",
                            onComplete: function () {
                                el.classList.add("hidden-section");
                            },
                        });
                    }
                });
                setTimeout(function () {
                    profileEl.classList.add("active");
                    gsap.fromTo(profileEl, { autoAlpha: 0, scale: 0.96, y: 15 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.8, ease: "power2.out" });
                    backBtn.classList.add("visible");
                    gsap.fromTo(backBtn, { autoAlpha: 0, x: -10 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power2.out" });

                    if (bottomAudioPlayer) {
                        bottomAudioPlayer.classList.add("active");
                        gsap.fromTo(bottomAudioPlayer, { autoAlpha: 0, y: 25 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" });
                    }

                    if (skipSongBtn) {
                        skipSongBtn.classList.add("visible");
                        gsap.fromTo(skipSongBtn, { autoAlpha: 0, y: 15 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" });
                    }

                    playProfileAudio(who);
                }, 500);
                history.pushState(null, "", "#" + who);
            };
            function showLanding() {
                if (!currentProfile) return;
                const profileEl = document.getElementById("profile-" + currentProfile);
                stopProfileAudio();
                document.body.classList.remove("profile-open");

                if (profileBanner) {
                    gsap.to(profileBanner, {
                        autoAlpha: 0,
                        scale: 1.06,
                        xPercent: -50,
                        yPercent: -50,
                        duration: 0.55,
                        ease: "power2.inOut",
                        onComplete: function () {
                            profileBanner.classList.remove("active");
                        }
                    });
                }

                if (profileDimmer) {
                    gsap.to(profileDimmer, {
                        autoAlpha: 0,
                        duration: 0.6,
                        ease: "power2.inOut",
                        onComplete: function () {
                            profileDimmer.classList.remove("active");
                        }
                    });
                }

                if (skipSongBtn) {
                    gsap.to(skipSongBtn, {
                        autoAlpha: 0,
                        y: 10,
                        duration: 0.3,
                        ease: "power2.in",
                        onComplete: function () {
                            skipSongBtn.classList.remove("visible");
                        }
                    });
                }

                if (bottomAudioPlayer) {
                    gsap.to(bottomAudioPlayer, {
                        autoAlpha: 0,
                        y: 15,
                        duration: 0.35,
                        ease: "power2.in",
                        onComplete: function () {
                            bottomAudioPlayer.classList.remove("active");
                        }
                    });
                }

                gsap.to(profileEl, {
                    autoAlpha: 0,
                    scale: 0.96,
                    duration: 0.45,
                    ease: "power2.inOut",
                    onComplete: function () {
                        profileEl.classList.remove("active");
                    },
                });
                gsap.to(backBtn, {
                    autoAlpha: 0,
                    duration: 0.3,
                    ease: "power2.out",
                    onComplete: function () {
                        backBtn.classList.remove("visible");
                    },
                });
                setTimeout(function () {
                    landingEls.forEach(function (el) {
                        if (el) {
                            el.classList.remove("hidden-section");
                            gsap.to(el, { autoAlpha: 1, duration: 0.8, ease: "power2.out" });
                        }
                    });
                }, 400);
                currentProfile = null;
                history.pushState(null, "", window.location.pathname);
            }
            backBtn.addEventListener("click", showLanding);
            const VALID_PROFILES = ["Maxim", "rupo"];
            window.addEventListener("popstate", function () {
                const hash = window.location.hash.replace("#", "");
                if (VALID_PROFILES.indexOf(hash) !== -1) {
                    showProfile(hash);
                } else if (currentProfile) {
                    showLanding();
                }
            });
            let toast = null;
            function showToast(text) {
                if (!toast) {
                    toast = document.createElement("div");
                    toast.className = "copy-toast";
                    document.body.appendChild(toast);
                }
                toast.textContent = text;
                toast.classList.add("show");
                setTimeout(function () {
                    toast.classList.remove("show");
                }, 1800);
            }
            document.querySelectorAll(".copy-link").forEach(function (link) {
                link.addEventListener("click", function (e) {
                    e.preventDefault();
                    const key = link.getAttribute("data-copy");
                    let text = "";
                    if (!text) return;
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(function () {
                            showToast("copied: " + text);
                        });
                    } else {
                        const tmp = document.createElement("textarea");
                        tmp.value = text;
                        tmp.style.position = "fixed";
                        tmp.style.opacity = "0";
                        document.body.appendChild(tmp);
                        tmp.select();
                        document.execCommand("copy");
                        document.body.removeChild(tmp);
                        showToast("copied: " + text);
                    }
                });
            });
            document.addEventListener("contextmenu", function (e) {
                e.preventDefault();
            });
        </script>
        <script>
            (function () {
                var fullText = "H A T E . 移动";
                var currentText = "H";
                var index = 1;
                var isTyping = true;
                function animateTitle() {
                    if (isTyping) {
                        currentText += fullText.charAt(index);
                        index++;
                        document.title = currentText;
                        if (index >= fullText.length) {
                            isTyping = false;
                            setTimeout(animateTitle, 2000);
                            return;
                        }
                        setTimeout(animateTitle, 300);
                    } else {
                        currentText = "H";
                        index = 1;
                        isTyping = true;
                        document.title = currentText;
                        setTimeout(animateTitle, 300);
                    }
                }
                setTimeout(animateTitle, 300);
            })();
        </script>
        <script>
            (function () {
                const overlay = document.getElementById("pageTransitionOverlay");
                if (overlay && typeof gsap !== "undefined") {
                    overlay.style.opacity = "0";
                    overlay.style.pointerEvents = "none";
                }
                window.addEventListener("pageshow", function (event) {
                    if (event.persisted && overlay) {
                        overlay.style.opacity = "0";
                        overlay.style.pointerEvents = "none";
                    }
                });
                const archivesBtn = document.getElementById("archivesBtn");
                if (archivesBtn) {
                    archivesBtn.addEventListener("click", function (e) {
                        e.preventDefault();
                        const target = this.getAttribute("href") || "projects.html";
                        if (typeof currentProfileAudio !== "undefined" && currentProfileAudio && typeof gsap !== "undefined") {
                            gsap.to(currentProfileAudio, { volume: 0, duration: 0.35 });
                        }
                        if (overlay && typeof gsap !== "undefined") {
                            overlay.style.pointerEvents = "auto";
                            gsap.to(overlay, {
                                opacity: 1,
                                duration: 0.45,
                                ease: "power2.inOut",
                                onComplete: function () {
                                    window.location.href = target;
                                }
                            });
                        } else {
                            window.location.href = target;
                        }
                    });
                }
            })();
        </script>
    </body>
</html>
